server:
  port: 8080

spring:
  application:
    name: rural-revitalization

  # ==================== 数据源配置 ====================
  datasource:
    url: jdbc:mysql://localhost:3306/rural_revitalization?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  # ==================== JPA 配置 ====================
  jpa:
    hibernate:
      ddl-auto: update          # 开发环境: 自动建表/更新表结构
    show-sql: true              # 控制台打印SQL
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ==================== JSON 序列化配置 ====================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # ==================== 文件上传配置 ====================
  servlet:
    multipart:
      max-file-size: 5MB         # 单文件最大 5MB
      max-request-size: 10MB     # 整个请求最大 10MB

  # ==================== Redis 配置 ====================
  # 如果暂时不用 Redis，关闭自动仓库扫描（消除启动警告）
  data:
    redis:
      repositories:
        enabled: false

# ==================== JWT 配置 ====================
jwt:
  secret: YourSuperSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong!!
  expiration: 86400000          # Token 有效期: 24小时 (毫秒)

# ==================== Swagger / OpenAPI 配置 ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html       # 访问地址: http://localhost:8080/swagger-ui.html
    tags-sorter: alpha           # 标签按字母排序
    operations-sorter: method    # 接口按 HTTP 方法排序
  api-docs:
    path: /v3/api-docs           # OpenAPI JSON: http://localhost:8080/v3/api-docs

# ==================== 日志配置 ====================
logging:
  level:
    com.example.rural: debug
    org.hibernate.SQL: debug

# ==================== 文件上传存储配置 ====================
file:
  upload-dir: uploads              # 上传文件存储目录（相对于项目根目录）
  local-cache-dir: local-cache     # 本地图片缓存目录（离线场景使用）
